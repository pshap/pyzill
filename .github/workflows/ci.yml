name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run of the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one platform must not hide the result on the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project and its development extra
        # ``--frozen`` installs exactly what uv.lock records, so CI and a
        # developer running ``uv sync --frozen`` get the same dependency set.
        run: uv sync --frozen --all-extras

      # The gate runs every check the project requires: the formatter, the
      # linter, the type checker, the dead-code check, and the offline tests
      # with the coverage floor. It fails on the first gate that fails.
      - name: Run the quality gate
        shell: bash
        run: scripts/check.sh

      # One audit is enough: the dependency set is the same on every runner.
      - name: Audit installed dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run --with pip-audit pip-audit
