name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run of the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project and its development extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The gate runs every check the project requires: the formatter, the
      # linter, the type checker, the dead-code check, and the offline tests.
      # It fails on the first gate that fails.
      - name: Run the quality gate
        run: scripts/check.sh
