[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyzill"
version = '1.3.0'
description = 'Zillow scraper in Python'
authors = [
  { name="John Balvin", email="johnchristian@hotmail.es" },
  { name="pshap" },
]
readme= "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords=['zillow', 'scraper', 'crawler']
dependencies=['curl_cffi>=0.16.3','typer>=0.27','rich>=13.8']

[project.scripts]
pyzill = "pyzill.cli:main_entry"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6"]

[project.urls]
Homepage='https://github.com/pshap/pyzill'

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyzill = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: opt-in tests that contact Zillow"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "C4", "SIM",
    "RUF", "N", "A", "RET", "PIE", "PERF", "FURB", "TID",
    "PGH", "PTH", "ISC", "ICN", "LOG", "G", "RSE", "PLW", "PLE",
    "DTZ", "ERA", "PT", "S", "PLR", "ARG",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913", "PLR0917", "PLR2004", "ARG001", "ARG005"]
# Typer turns each function parameter into a CLI option, so command signatures
# legitimately exceed the positional-argument threshold.
"src/pyzill/cli/**" = ["PLR0917"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/pyzill", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
