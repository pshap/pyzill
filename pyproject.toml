[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyzill"
version = '1.2.0'
description = 'Zillow scraper in Python'
authors = [
  { name="John Balvin", email="johnchristian@hotmail.es" },
]
readme= "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords=['zillow', 'scraper', 'crawler']
dependencies=['bs4','requests','curl_cffi']

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.urls]
Homepage='https://github.com/johnbalvin/pyzill'

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "C4", "SIM",
    "RUF", "N", "A", "RET", "PIE", "PERF", "FURB", "TID",
    "PGH", "PTH", "ISC", "ICN", "LOG", "G", "RSE", "PLW", "PLE",
    "DTZ", "ERA", "PT", "S", "PLR", "ARG",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913", "PLR0917", "PLR2004", "ARG001", "ARG005"]

[tool.ruff.format]
quote-style = "double"
