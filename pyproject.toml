[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyzill"
version = '1.4.0'
description = 'Zillow scraper in Python'
authors = [
  { name="John Balvin", email="johnchristian@hotmail.es" },
  { name="pshap" },
]
readme= "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords=['zillow', 'scraper', 'crawler']
dependencies=['curl_cffi>=0.16.3,<0.17','typer>=0.27','rich>=13.8']

[project.scripts]
pyzill = "pyzill.cli:main_entry"

[project.optional-dependencies]
# ``dev`` builds on ``test`` so the pytest version is stated once.
test = ["pytest>=7", "pytest-cov>=5"]
dev = ["pyzill[test]", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6", "vulture>=2.14"]

[project.urls]
Homepage='https://github.com/pshap/pyzill'

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyzill = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: opt-in tests that contact Zillow"]

[tool.coverage.run]
source = ["pyzill"]

[tool.coverage.report]
# The gate refuses to land a change that drops coverage below this line.
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "C4", "SIM",
    "RUF", "N", "A", "RET", "PIE", "PERF", "FURB", "TID",
    "PGH", "PTH", "ISC", "ICN", "LOG", "G", "RSE", "PLW", "PLE",
    "DTZ", "ERA", "PT", "S", "PLR", "ARG", "C90",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913", "PLR0917", "PLR2004", "ARG001", "ARG005"]
# The CLI is the adapter between the flags and the library: a Typer command
# turns every parameter into a command-line option, and the render helpers
# take the comparable set of presentation parameters, so the argument and
# positional-argument thresholds do not apply here.
"src/pyzill/cli/**" = ["PLR0913", "PLR0917"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/pyzill", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false

[tool.vulture]
paths = ["src"]
min_confidence = 80
# Typer registers command functions through decorators, so they have no
# in-tree caller; the public client/search surface is used by callers only.
ignore_names = [
    "app",
    "main",
    "main_entry",
    "db_sync",
    "db_import",
    "db_query",
    "db_history",
    "db_changes",
    "db_stats",
    "detail_home",
    "detail_apartment",
    "search_sale",
    "search_rent",
    "search_sold",
    "for_sale",
    "for_rent",
    "sold",
    # Typer binds a command's option parameters from the command line, and the
    # CLI reads them out of the command's own locals(), so a filter name that
    # the rest of the tree never mentions looks unused.
    "zoom",
]
